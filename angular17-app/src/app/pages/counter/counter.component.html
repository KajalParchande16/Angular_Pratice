<div class="row p-5">
    <div class="col-lg-3">
        <button type="button" class="btn btn-primary" (click)="increment()">Increment</button>
    </div>
    <div class="col-lg-3">
        <h2>{{counterVal | async}}</h2>
    </div>
    <div class="col-lg-3">
        <button  type="button" class="btn btn-danger" (click)="decrement()">Decrement</button>

    </div>
</div>
